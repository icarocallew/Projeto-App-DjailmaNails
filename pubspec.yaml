name: meuapp
description: Projeto de agendamento simples
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Gerenciamento de estado
  provider: ^6.0.5

  # Ícones
  cupertino_icons: ^1.0.6

dev_dependencies:
